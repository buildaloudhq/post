version: 2
updates:
  # Keep Go module dependencies current.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the SHA and
  # updates the `# vX.Y.Z` comment alongside it).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
