# Enforce Conventional Commits on the PR *title*.
#
# With squash-merge, the PR title becomes the single commit that lands on
# main — so this title is what feeds versioning + the changelog. This is the
# non-bypassable gate (the local Lefthook hook is just fast feedback and can
# be skipped with --no-verify).
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
